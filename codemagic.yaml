workflows:
  ios-workflow:
    name: iOS Build - GMParts
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Key2
    environment:
      ios_signing:
        provisioning_profiles:
          - GMParts AppStore
        certificates:
          - Apple Distribution Certificate
    scripts:
      - name: Install Flutter
        script: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          export PATH="$PATH:$HOME/flutter/bin"
          flutter doctor
      - name: Install dependencies
        script: |
          export PATH="$PATH:$HOME/flutter/bin"
          flutter pub get
      - name: Build iOS
        script: |
          export PATH="$PATH:$HOME/flutter/bin"
          xcode-project use-profiles
          flutter build ipa --release
      - name: Find IPA
        script: |
          echo "=== build/ios ==="
          ls -la build/ios/ 2>/dev/null || echo "No build/ios folder"
          echo "=== find xcarchive ==="
          find . -name "*.xcarchive" 2>/dev/null
          echo "=== find ipa ==="
          find . -name "*.ipa" 2>/dev/null
    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
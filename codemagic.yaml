workflows:
  ios-workflow:
    name: iOS Build - GMParts
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    integrations:
      app_store_connect: Codemagic Key2
    environment:
      ios_signing:
        provisioning_profiles:
          - GMParts AppStore v2
        certificates:
          - Apple Distribution Certificate
    scripts:
      - name: Install Flutter
        script: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b 3.44.8 $HOME/flutter
          export PATH="$PATH:$HOME/flutter/bin"
          flutter doctor
      - name: Install dependencies
        script: |
          export PATH="$PATH:$HOME/flutter/bin"
          flutter pub get
      - name: Analyze code
        script: |
          export PATH="$PATH:$HOME/flutter/bin"
          flutter analyze
      - name: Generate launcher icons
        script: |
          export PATH="$PATH:$HOME/flutter/bin"
          flutter pub run flutter_launcher_icons
      - name: Build iOS
        script: |
          export PATH="$PATH:$HOME/flutter/bin"
          xcode-project use-profiles
          flutter build ipa --release --build-number=$BUILD_NUMBER
      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
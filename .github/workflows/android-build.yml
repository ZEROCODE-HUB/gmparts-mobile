name: Android Build & Sign
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          java-version: '17'
          distribution: 'temurin'
      # La version se FIJA, no se sigue el canal.
      #
      # Esto usaba `channel: stable` y se rompio solo el 2026-08-26 sin que nadie tocara el
      # proyecto: stable paso a Flutter 3.47.1, cuyo `flutter_localizations` exige
      # `intl ^0.20.3`, y el pubspec fija 0.20.2. `flutter pub get` fallo y no hubo build.
      #
      # Ademas iOS (codemagic.yaml) ya compila con 3.44.8 fijada. Tener cada tienda con un
      # SDK distinto es pedir que una funcione y la otra no por motivos que nadie ve. Al
      # cambiar esta version, cambiar tambien la de codemagic.yaml.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
      - name: Install dependencies
        run: flutter pub get
      # El valor va entre comillas y por `env`. Con `echo` sin comillas el shell parte el
      # secreto por espacios y le anade un salto de linea: hoy funciona por suerte, no por
      # diseno, y si el keystore se regenera puede dejar de decodificar sin avisar.
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/gmparts-keystore.jks
      # Las credenciales del keystore van SOLO por `env`, que es de donde las lee
      # `signingConfigs.release` en android/app/build.gradle.
      #
      # Antes viajaban ADEMAS como `--dart-define`, y eso es una fuga: un `--dart-define`
      # se hornea dentro del binario de Dart y se puede recuperar del AAB publicado. Cada
      # version subida a Play llevaba dentro la contrasena del keystore. Y encima no servian
      # para nada: ninguna linea de `lib/` lee esos valores.
      #
      # Si alguna vez se subio a Play un AAB construido asi, la contrasena hay que darla por
      # comprometida y rotarla.
      - name: Build Android AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
        env:
          KEYSTORE_PATH: gmparts-keystore.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload AAB
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b
        with:
          name: gmparts-release
          path: build/app/outputs/bundle/release/app-release.aab

# Release de Android construida con Shorebird.
#
# Sustituye al antiguo `android-build.yml`. La diferencia que importa: la release queda
# registrada en Shorebird, asi que a partir de ella se le pueden publicar PARCHES de codigo
# Dart sin pasar por Play. Una build hecha con `flutter build` a secas no es parcheable.
#
# Cuando usar esto y no un parche: lo dice RELEASE.md. En corto, si el cambio toca algo
# fuera de `lib/**.dart` —assets, android/, pubspec, un plugin— hace falta release.
#
# Produce AAB (para Play) y APK (para instalar a mano), y es IMPRESCINDIBLE que salgan de
# la MISMA invocacion de `shorebird release`: dos builds separadas generan dos snapshots
# AOT distintos, Shorebird registraria una sola release y el parche no casaria con el otro
# artefacto.
name: Android Release (Shorebird)
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # Las credenciales del keystore las lee `signingConfigs.release` de
    # android/app/build.gradle. Shorebird envuelve `flutter build`, que invoca el mismo
    # Gradle de siempre, asi que la firma no cambia en nada respecto al workflow anterior.
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      KEYSTORE_PATH: gmparts-keystore.jks
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Flutter normal, solo para PREPARAR el proyecto. Shorebird trae el suyo y lo elige
      # con `--flutter-version`; este de aqui no compila nada.
      #
      # Hace falta porque el repo no versiona `android/gradlew` ni `android/local.properties`
      # (el segundo esta en .gitignore). Flutter los fabrica al compilar, asi que con
      # `flutter build` nunca se noto, pero Shorebird invoca gradlew antes de construir.
      # Si algun dia se versiona el wrapper, estos dos pasos sobran.
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'

      - name: Preparar el proyecto
        run: |
          flutter pub get
          cd android
          gradle wrapper --gradle-version 8.12 --distribution-type all

      - uses: shorebirdtech/setup-shorebird@v1

      # El valor va entre comillas y por `env`. Con `echo` sin comillas el shell parte el
      # secreto por espacios y le anade un salto de linea.
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/gmparts-keystore.jks

      # `--flutter-version` FIJO: sin el, Shorebird usa su Flutter mas reciente (3.47.5),
      # que exige `intl ^0.20.3` contra el `intl: 0.20.2` del pubspec y revienta en
      # `pub get`. Es el fallo que tumbo la build el 2026-08-26. Los parches heredan
      # automaticamente la version de la release, asi que solo se declara aqui.
      #
      # Nada de `--obfuscate`, `--split-debug-info` ni `--split-per-abi`: son el bloqueador
      # de parches mas habitual de Shorebird.
      # El versionCode se desplaza 100 a proposito.
      #
      # Antes salia de `github.run_number` a secas, y ese contador es POR WORKFLOW: al
      # renombrar `android-build.yml` a `android-release.yml` volvio a empezar en 1, con un
      # versionCode 36 ya publicado. Un versionCode menor lo rechaza Play, y Android tampoco
      # deja instalar el APK encima.
      #
      # Con el desplazamiento esta build sale como 101 y sigue siendo monotono. Si el
      # workflow se vuelve a renombrar, hay que subir el desplazamiento por encima del
      # ultimo versionCode publicado.
      - name: Calcular el versionCode
        run: echo "VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> $GITHUB_ENV

      - name: Shorebird release
        run: |
          shorebird release android \
            --artifact apk \
            --flutter-version 3.44.8 \
            -- --build-number=$VERSION_CODE

      - name: Ver que artefactos salieron
        run: ls -R build/app/outputs

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: gmparts-1.0.9+${{ env.VERSION_CODE }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gmparts-1.0.9+${{ env.VERSION_CODE }}-apk
          path: build/app/outputs/**/*.apk
          if-no-files-found: error

      # La release version es el dato operativo mas importante del sistema: es lo que hay
      # que pasarle al workflow de parche. Sin dejarlo escrito, dentro de un mes no se sabe
      # a que release apuntar.
      - name: Resumen
        run: |
          echo "## Release Shorebird: \`1.0.9+${{ env.VERSION_CODE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para parchearla, lanza **Android Patch** con ese valor en \`release_version\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Al publicarla, etiqueta el commit: \`git tag release/1.0.9+${{ env.VERSION_CODE }} && git push --tags\`" >> $GITHUB_STEP_SUMMARY

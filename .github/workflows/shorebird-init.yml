# Workflow de un solo uso: obtiene el app_id de Shorebird.
#
# Tres cosas aprendidas peleandose con esto, anotadas para no repetirlas:
#
#  1. `shorebird init` invoca gradlew para detectar flavors, y el repo no versiona
#     `android/gradlew` ni `android/local.properties` (el segundo esta en .gitignore).
#     Nadie lo habia notado porque `flutter pub get` fabrica los dos al preparar el
#     proyecto para Android.
#  2. `setup-shorebird` NO deja `flutter` en el PATH, y su input `flutter-version` no
#     cambia el SDK que instala: siempre trae el mas reciente de Shorebird (3.47.5). La
#     version se fija al compilar, con `shorebird release --flutter-version`.
#  3. Ese 3.47.5 exige `intl ^0.20.3` contra el `intl: 0.20.2` del pubspec y revienta en
#     `pub get` — el mismo fallo que tumbo la build el 2026-08-26.
#
# Por eso aqui el `pub get` se hace con el Flutter normal fijado en 3.44.8, y Shorebird
# solo se usa para el `init`, que no compila nada.
#
# Se hace en CI y no en local porque el equipo de desarrollo no tiene SDK de Android.
# Este workflow se borra en cuanto el app_id este commiteado.
name: Shorebird Init (un solo uso)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'

      - name: Preparar el proyecto (genera local.properties y gradlew)
        run: |
          flutter --version
          flutter pub get
          ls -la android/gradlew android/local.properties

      - uses: shorebirdtech/setup-shorebird@v1

      - name: shorebird init
        run: shorebird init --display-name "GMParts" --force

      - name: Mostrar lo generado
        run: |
          echo "=== shorebird.yaml ==="
          cat shorebird.yaml
          echo "=== diff pubspec.yaml ==="
          git diff -- pubspec.yaml

      - name: Commitear shorebird.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorebird.yaml pubspec.yaml
          git commit -m "chore(shorebird): app_id y shorebird.yaml como asset"
          git push

# Workflow de un solo uso: genera el Gradle wrapper y obtiene el app_id de Shorebird.
#
# Dos cosas que no se pueden hacer en el equipo de desarrollo: no tiene SDK de Android ni
# Gradle. Y el repo NO versiona el wrapper —solo `gradle-wrapper.properties`—, asi que
# `android/gradlew` no existe: Flutter lo genera al vuelo al compilar, por eso nadie lo
# habia notado, pero `shorebird init` lo invoca antes de cualquier build y fallaba con
# «Unable to initialize gradlew».
#
# Commitea de vuelta el wrapper y el shorebird.yaml. Se borra cuando esto este hecho.
name: Shorebird Init (un solo uso)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generar el Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.12 --distribution-type all
          ls -la gradlew gradle/wrapper/

      - uses: shorebirdtech/setup-shorebird@v1

      - name: shorebird init
        run: shorebird init --display-name "GMParts" --force

      - name: Mostrar lo generado
        run: |
          echo "=== shorebird.yaml ==="
          cat shorebird.yaml
          echo "=== diff pubspec.yaml ==="
          git diff -- pubspec.yaml

      - name: Commitear wrapper y shorebird.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradlew android/gradlew.bat android/gradle/wrapper/ shorebird.yaml pubspec.yaml
          git commit -m "chore(shorebird): Gradle wrapper versionado y app_id de Shorebird"
          git push

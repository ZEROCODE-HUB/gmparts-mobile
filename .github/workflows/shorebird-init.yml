# Workflow de un solo uso: obtiene el app_id de Shorebird.
#
# `shorebird init` invoca gradlew para detectar los flavors de la app, y el repo no versiona
# ni `android/gradlew` ni `android/local.properties` (el segundo esta en .gitignore). Nadie
# lo habia notado porque `flutter pub get` fabrica los dos al preparar el proyecto para
# Android — asi que basta con ejecutarlo antes.
#
# `setup-shorebird` deja `shorebird` en el PATH pero NO `flutter`, asi que hay que buscar el
# binario dentro de su cache. Se usa ESE Flutter a proposito: es el mismo que compilara las
# releases.
#
# Se hace aqui y no en local porque el equipo de desarrollo no tiene SDK de Android.
# Este workflow se borra en cuanto el app_id este commiteado.
name: Shorebird Init (un solo uso)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Flutter FIJADO a 3.44.8. Sin esto la action instala el Flutter mas reciente de
      # Shorebird (3.47.5), que exige `intl ^0.20.3` contra el `intl: 0.20.2` del pubspec:
      # exactamente el fallo que tumbo la build el 2026-08-26. Shorebird si vende 3.44.8.
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          flutter-version: 3.44.8

      - name: Localizar el Flutter de Shorebird
        run: |
          echo "which shorebird: $(which shorebird)"
          FLUTTER_BIN="$(find "$HOME/.config/shorebird" -type f -name flutter -path '*/bin/flutter' 2>/dev/null | head -1)"
          if [ -z "$FLUTTER_BIN" ]; then
            echo "No se encontro el Flutter de Shorebird. Arbol:"
            find "$HOME/.config/shorebird" -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "flutter: $FLUTTER_BIN"
          echo "$(dirname "$FLUTTER_BIN")" >> "$GITHUB_PATH"

      - name: Preparar el proyecto (genera local.properties y gradlew)
        run: |
          flutter --version
          flutter pub get
          ls -la android/gradlew android/local.properties

      - name: shorebird init
        run: shorebird init --display-name "GMParts" --force

      - name: Mostrar lo generado
        run: |
          echo "=== shorebird.yaml ==="
          cat shorebird.yaml
          echo "=== diff pubspec.yaml ==="
          git diff -- pubspec.yaml

      - name: Commitear shorebird.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorebird.yaml pubspec.yaml
          git commit -m "chore(shorebird): app_id y shorebird.yaml como asset"
          git push

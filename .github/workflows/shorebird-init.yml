# Workflow de un solo uso: genera el Gradle wrapper y obtiene el app_id de Shorebird.
#
# Dos cosas faltan en el repo y nadie lo habia notado porque Flutter las fabrica al vuelo
# en cada build:
#
#   · `android/gradlew` y `gradle-wrapper.jar` — solo esta versionado
#     `gradle-wrapper.properties`.
#   · `android/local.properties` — esta en .gitignore; `settings.gradle:4` lo lee.
#
# `shorebird init` invoca gradlew ANTES de cualquier build, asi que se topa con las dos
# ausencias. Aqui se crea `local.properties` a mano y se genera el wrapper, que ademas
# conviene versionar: deja de depender de que Flutter lo regenere igual cada vez.
#
# Se borra este workflow en cuanto el app_id este commiteado.
name: Shorebird Init (un solo uso)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Primero Shorebird: deja SU Flutter en el PATH, que es el que debe apuntar
      # `flutter.sdk` para que el wrapper y el init usen el mismo SDK que luego compila.
      - uses: shorebirdtech/setup-shorebird@v1

      - name: Crear android/local.properties
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          echo "flutter.sdk=$FLUTTER_ROOT"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "flutter.versionName=1.0.9"
            echo "flutter.versionCode=1"
          } > android/local.properties
          cat android/local.properties

      - name: Generar el Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.12 --distribution-type all
          ls -la gradlew gradle/wrapper/

      - name: shorebird init
        run: shorebird init --display-name "GMParts" --force

      - name: Mostrar lo generado
        run: |
          echo "=== shorebird.yaml ==="
          cat shorebird.yaml
          echo "=== diff pubspec.yaml ==="
          git diff -- pubspec.yaml

      - name: Commitear wrapper y shorebird.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradlew android/gradlew.bat android/gradle/wrapper/ shorebird.yaml pubspec.yaml
          git commit -m "chore(shorebird): Gradle wrapper versionado y app_id de Shorebird"
          git push
